name: reusable-drift-check

# Reusable workflow: audit config doc↔code drift for the CALLING repository.
#
# Same-repo case (code + docs together, e.g. StarRocks/starrocks):
#   jobs:
#     drift:
#       uses: StarRocks/doc-config-drift/.github/workflows/reusable-drift-check.yml@main
#       with:
#         components: "fe be"
#         changed-since: ${{ github.event.pull_request.base.sha }}   # optional, PR-only findings
#
# Split-repo case (docs here, code in StarRocks/starrocks — e.g. commercial docs):
#   pass code-repo/code-ref and the docs-dir/code-file inputs; see README.

on:
  workflow_call:
    inputs:
      components:
        description: 'Space-separated components to check (fe, be).'
        type: string
        default: 'fe be'
      changed-since:
        description: 'Git ref; when set, only params changed vs this ref are reported.'
        type: string
        default: ''
      fail-on-drift:
        description: 'Fail the job when authoritative drift is found.'
        type: boolean
        default: false
      code-repo:
        description: >
          Repo holding the code source-of-truth (default: the caller). Set this
          for the split-repo case (docs here, code elsewhere). This is the single
          swap point when the source of truth later moves to a commercial repo.
        type: string
        default: ''
      code-ref:
        description: 'Ref of code-repo to check out (branch/tag/sha).'
        type: string
        default: 'main'
      docs-dir:
        description: >
          Path (relative to the caller repo) to the docs root to scan. Defaults
          to the StarRocks *_parameters dir per component; cloud docs pass e.g.
          "docs/en" and combine with subset=true.
        type: string
        default: ''
      subset:
        description: >
          Docs are a curated subset (e.g. a cloud product): report only value
          drift, skip undocumented/stale.
        type: boolean
        default: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller (docs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: caller

      - name: Check out the drift engine
        uses: actions/checkout@v4
        with:
          repository: StarRocks/doc-config-drift
          ref: main
          path: engine

      - name: Check out code source-of-truth (split-repo only)
        if: inputs.code-repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.code-repo }}
          ref: ${{ inputs.code-ref }}
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run drift audit
        env:
          CODE_REPO: ${{ inputs.code-repo }}
          DOCS_DIR: ${{ inputs.docs-dir }}
          SUBSET: ${{ inputs.subset }}
          CHANGED_SINCE: ${{ inputs.changed-since }}
        run: |
          set +e
          rc=0
          : > "$GITHUB_STEP_SUMMARY"
          for comp in ${{ inputs.components }}; do
            echo "## ${comp^^} configuration drift" >> "$GITHUB_STEP_SUMMARY"
            # StarRocks-layout code path + default docs dir per component.
            case "$comp" in
              fe) codepath="fe/fe-core/src/main/java/com/starrocks/common/Config.java"
                  docdefault="docs/en/administration/management/FE_parameters" ;;
              be) codepath="be/src/common/config.h"
                  docdefault="docs/en/administration/management/BE_parameters" ;;
            esac
            docsdir="${DOCS_DIR:-$docdefault}"
            if [ -n "$CODE_REPO" ]; then
              # split-repo: code from another checkout, docs from the caller
              args="--component $comp --code-file code/$codepath --docs-dir caller/$docsdir --format markdown"
            else
              # same-repo: code and docs together in the caller
              args="--component $comp --repo caller --format markdown"
              [ -n "$CHANGED_SINCE" ] && args="$args --changed-since $CHANGED_SINCE"
            fi
            [ "$SUBSET" = "true" ] && args="$args --subset"
            python3 engine/drift_audit.py $args >> "$GITHUB_STEP_SUMMARY"
            [ $? -ne 0 ] && rc=1
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ inputs.fail-on-drift }}" = "true" ]; then exit $rc; fi
          exit 0
