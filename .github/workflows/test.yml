name: test

# Self-test for the drift engine: run the regression suite on every push/PR.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install pytest
      - run: python3 -m pytest tests/ -q
